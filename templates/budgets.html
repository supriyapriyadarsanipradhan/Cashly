{% extends "base.html" %}

{% block content %}
<div id="budgets-view">
    <!-- Header Block -->
    <div class="row align-items-center mb-4">
        <div class="col-md-8">
            <h1 class="mb-1">Category Budgets</h1>
            <p class="text-secondary">Set and monitor monthly category budgets. Warning levels trigger automatically at 75% and 100% usage.</p>
        </div>
        <div class="col-md-4 text-md-end d-flex gap-2 justify-content-md-end">
            <button class="btn btn-outline-custom" onclick="setupRecommendedBudgets()">
                <i class="fas fa-magic me-2 text-emerald"></i> Auto-Setup (50/30/20)
            </button>
            <button class="btn btn-emerald" data-bs-toggle="modal" data-bs-target="#budgetModal">
                <i class="fas fa-plus me-2"></i> Configure Budget
            </button>
        </div>
    </div>

    <!-- Budgets list grid -->
    <div class="row" id="budgets-list">
        <!-- Loaded dynamically via JavaScript -->
        <div class="col-12 text-center text-muted py-5">
            <i class="fas fa-spinner fa-spin fa-2x mb-3 text-emerald"></i>
            <p>Loading monthly budgets...</p>
        </div>
    </div>
</div>

<!-- Modal: Configure Budget -->
<div class="modal fade" id="budgetModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-wallet text-emerald me-2"></i> Configure Budget Limit</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="budgetForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="budget-category" class="form-label">Category</label>
                        <select class="form-select" id="budget-category" required>
                            <option value="Food & Dining">Food & Dining</option>
                            <option value="Housing & Rent">Housing & Rent</option>
                            <option value="Utilities & Bills">Utilities & Bills</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Health & Fitness">Health & Fitness</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="budget-amount" class="form-label">Monthly Limit Amount (₹)</label>
                        <input type="number" step="0.01" min="1" class="form-control" id="budget-amount" required placeholder="0.00">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-emerald">Save Budget</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
